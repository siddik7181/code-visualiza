name: Pages

# Publishes the web build of the visualizer (site/ + the extension's engine, see `npm run build:site`) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions". After that every push to main redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a running deploy finish rather than cancel it half way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
